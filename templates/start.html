{% extends "base.html" %}
{% block content %}
<section class="card neon-card">
  <h2>🧑‍🚀 Player Setup</h2>
  <p>Before the challenge starts, enter your details.</p>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" class="form-grid">
    <label>
      Name
      <input type="text" name="name" required value="{{ name or '' }}" />
    </label>
    <label>
      College Course
      <input type="text" name="course" required value="{{ course or '' }}" />
    </label>
    <button class="btn" data-sound="start" type="submit">Begin Assessment</button>
  </form>
</section>
{% endblock %}
